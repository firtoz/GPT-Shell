# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "development", "production", "gpt-shell" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    env:
      MAIN_SERVER_ID: 1049538754202828880

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22.23.4"]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install native canvas build dependencies
      run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
    - run: yarn
    - run: yarn build
    - run: yarn test
    
